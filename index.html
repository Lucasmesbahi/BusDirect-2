<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusDirect - Gestion des trajets</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">

    <header class="bg-white border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-[#0B2545]">BusDirect</h1>
                <p class="text-sm text-slate-500">Gestion des réservations</p>
            </div>

            <div class="text-sm text-slate-600">
                Gestion des trajets
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-8">

        <div class="mb-6">
            <h2 class="text-2xl font-bold text-[#0B2545]">Liste des trajets</h2>
            <p class="text-slate-500 text-sm mt-1">Consultez et gérez les trajets disponibles.</p>
        </div>

        <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">

            <div class="bg-white p-5 rounded-lg border border-slate-200">
                <p class="text-sm text-slate-500">Nombre de trajets</p>
                <p class="text-2xl font-bold text-[#0B2545] mt-2">20</p>
            </div>

            <div class="bg-white p-5 rounded-lg border border-slate-200">
                <p class="text-sm text-slate-500">Passagers</p>
                <p class="text-2xl font-bold text-[#0B2545] mt-2">145</p>
            </div>

            <div class="bg-white p-5 rounded-lg border border-slate-200">
                <p class="text-sm text-slate-500">Recette totale</p>
                <p class="text-2xl font-bold text-[#0B2545] mt-2">20 000 DH</p>
            </div>

        </section>

        <section class="bg-white p-5 rounded-lg border border-slate-200 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                <div>
                    <label class="block text-sm font-medium mb-2">Rechercher un trajet</label>
                    <input
                        id="ville"
                        type="text"
                        placeholder="Ville de départ ou destination..."
                        class="w-full border border-slate-300 rounded-md px-3 py-2 outline-none focus:border-[#0B2545]"
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2">Filtrer par statut</label>
                    <select id="filtrer" class="w-full border border-slate-300 rounded-md px-3 py-2 bg-white">
                        <option value="tout">Tous les trajets</option>
                        <option value="disponible" >Disponible</option>
                        <option value="complete">Complet</option>
                    </select>
                </div>

            </div>
        </section>

        <section>
            <h3 class="text-lg font-semibold text-[#0B2545] mb-4">Tous les trajets</h3>

            <div id="tripsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

 
            </div>
        </section>

        <div id="pagination" class="flex justify-center items-center gap-2 mt-8">
        </div>
        <script type="module" src="./js/main-trajets.js"></script>
    </main>

</body>
</html>
